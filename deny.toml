[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin attack: timing side channel in RSA decryption and signing with
    # private keys. rupta uses RSA only to verify ID token signatures with
    # the identity provider's public keys (via openidconnect); private RSA
    # keys exist only in tests. No fixed version of the crate exists yet.
    { id = "RUSTSEC-2023-0071", reason = "only public-key signature verification in production" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/michaeldoehler/squad"]
