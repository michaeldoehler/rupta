# Single-node Garage for the compose stack. rpc_secret and admin_token come
# from GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN. For production, run a Garage
# cluster with replication_factor = 3 (see docs/deployment.md).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"
