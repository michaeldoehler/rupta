name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, configuration (without secrets) and, for ingestion problems, the SDK name and version.
  - type: input
    id: version
    attributes:
      label: rupta version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
