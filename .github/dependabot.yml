version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tag is a Rust version: ci.yml pins @1.89 to test the MSRV
      # (rust-version in Cargo.toml), which moves with that, not with
      # whatever toolchain is newest. The other uses follow @stable.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
