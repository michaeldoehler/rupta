# Optional monitoring for the compose setup: Prometheus with the rupta
# alert rules, and Grafana with the rupta dashboard.
#
#   docker compose -f compose.yaml -f compose.monitoring.yaml up -d
#   open http://localhost:3000   (admin / GRAFANA_ADMIN_PASSWORD)
#
# Needs RUPTA_METRICS_TOKEN and GRAFANA_ADMIN_PASSWORD in .env
# (scripts/generate-env.sh writes both). Prometheus listens on
# localhost:9090 only. See docs/monitoring.md.
name: rupta

services:
  rupta:
    environment:
      RUPTA_METRICS_TOKEN: ${RUPTA_METRICS_TOKEN:?set RUPTA_METRICS_TOKEN in .env}

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rupta-alerts.yml:/etc/prometheus/rupta-alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - source: rupta_metrics_token
        target: /etc/prometheus/rupta-metrics-token
    depends_on:
      - rupta

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_PLUGINS_PREINSTALL: yesoreyeram-infinity-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      RUPTA_GRAFANA_TOKEN: ${RUPTA_GRAFANA_TOKEN:-}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/rupta-overview.json:/var/lib/grafana/dashboards/rupta/rupta-overview.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

secrets:
  rupta_metrics_token:
    environment: RUPTA_METRICS_TOKEN

volumes:
  prometheus-data:
  grafana-data:
